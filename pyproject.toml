[project]
name = "movemap"
version = "0.1.0"
description = "地方移住検討者向け全国MAP - 個人ツール"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "takanori.koyama" }
]
dependencies = [
    "streamlit>=1.32",
    "plotly>=5.20",
    "duckdb>=0.10",
    "pandas>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "statsmodels>=0.14",
    "prophet>=1.1",
    "python-dotenv>=1.0",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-httpx>=0.30",
    "freezegun>=1.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: 長時間テスト(E2E パイプライン等、ARIMA 学習を多数走らせる)。`pytest -m slow` で実行",
]

# Streamlit テーマ設定(50-60 代向けの可読性重視)
# 詳細な CSS は app/shared/ui_theme.py の inject_global_css() で注入する.

[theme]
base = "light"
primaryColor = "#1f4068"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1a1a2e"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
# Streamlit Cloud のツールバー(Fork ボタン・GitHub アイコン・Manage app)を非表示化.
# 広告経由の訪問者に「無料 OSS の個人アプリ」という印象を与えず、製品として
# 一貫した体験にするため(2026-07-12、リスティング広告配信に伴う対応).
toolbarMode = "minimal"

# Streamlit テーマ設定(50-60 代向けの可読性重視)
# 詳細な CSS は app/shared/ui_theme.py の inject_global_css() で注入する.

[theme]
base = "light"
primaryColor = "#1f4068"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1a1a2e"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

name: Keep MoveMap awake

# Streamlit Community Cloud の "無アクセスでスリープ" を防ぐため
# 3 時間に 1 回 https://movemap.streamlit.app/ に HTTP GET を投げる.
#
# - ステータスコードと応答時間のみログに残す(本文は /dev/null へ捨てる)
# - 失敗(非 2xx / タイムアウト)時は workflow が赤くなり GitHub から通知される
# - workflow_dispatch で手動 trigger 可能
#
# 履歴:
#   - 2026-06-13: 6 時間毎で開始
#   - 2026-06-15: 3 時間毎に短縮(6h cron の実態は ±30 分ドリフトで 7h 超になり、
#                  新規アプリ・低トラフィック時の Cloud 側活動カウンタが切れた).
#                  UptimeRobot との二重監視で運用.
#
# 参照:
#   - DEC-016 mode C 公開
#   - INV-BIZ-008 公開デモの可用性維持

on:
  schedule:
    - cron: "0 */3 * * *"   # 3 時間毎(UTC)= 0, 3, 6, 9, 12, 15, 18, 21 時 UTC
                            # JST だと 9, 12, 15, 18, 21, 0, 3, 6 時
  workflow_dispatch:         # Actions タブから手動実行も可

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping movemap.streamlit.app
        run: |
          set -euo pipefail
          URL="https://movemap.streamlit.app/"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          COOKIE_JAR="$(mktemp)"
          echo "Pinging ${URL} ..."
          # Streamlit Cloud は最初のリクエストで /-/login にリダイレクトし
          # セッション Cookie を発行する. Cookie jar を持たないクライアント
          # (default curl)は無限リダイレクトに陥るため -b/-c で有効化する.
          curl --fail-with-body \
               --location \
               --max-redirs 20 \
               --max-time 60 \
               --retry 2 \
               --retry-delay 10 \
               --silent --show-error \
               --cookie-jar "${COOKIE_JAR}" \
               --cookie    "${COOKIE_JAR}" \
               --user-agent "${UA}" \
               --output /dev/null \
               --write-out "HTTP %{http_code} (%{time_total}s) — %{url_effective}\n" \
               "${URL}"

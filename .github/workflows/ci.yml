name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 をプライマリ、3.12 で将来互換性を確認
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app/
        continue-on-error: true

      - name: Dependency audit (pip-audit) — DEC-014
        run: |
          uv run --with pip-audit pip-audit --strict --ignore-vuln GHSA-* || true
        continue-on-error: true

      - name: Run unit & integration tests
        run: uv run pytest tests/unit tests/integration -v

      - name: Smoke test (seed.py + main.py import)
        run: |
          uv run python scripts/seed.py
          uv run python -c "from app import main"
